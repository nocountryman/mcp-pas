# PAS Configuration
# Quality gate parameters - modify without code changes

quality_gate:
  min_score_threshold: 0.9
  min_gap_threshold: 0.08  # v35c: lowered from 0.10

# Failure surfacing thresholds
failure_surfacing:
  semantic_threshold: 0.55
  max_warnings: 3

# Session defaults
session:
  max_depth: 10
  default_top_n: 3

# v43: Project Purpose Awareness
purpose_inference:
  completeness_similarity_threshold: 0.7  # Minimum similarity for module to count as "implemented"
  staleness_days: 7  # Purpose older than this triggers refresh suggestion

# v48: Parallel Critique Window
parallel_critique:
  enabled: true
  critique_ratio: 0.7      # Critique hypotheses >= winner * ratio
  max_candidates: 3        # Limit to avoid latency explosion

# v56-v60: Calibration Decay
calibration:
  decay_rate: 0.5                    # How aggressively to reduce confidence (0-1)
  bias_threshold: 0.1                # Only apply decay if bias exceeds this
  min_samples_for_decay: 20          # Warmup period before applying decay
  min_samples_for_stats: 10          # Samples needed for basic stats
  enable_domain_stratification: true # Use per-domain calibration when available
  fallback_to_global: true           # Use global stats if domain has insufficient samples
